name: Windows

on:
  push:
    branches: ["**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  # Creating a release (for example gh release create v1.2.0 dist/Envy.dmg) builds the installer and attaches it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach Envy-Setup.exe to this existing release tag (leave empty to only build)"
        required: false

defaults:
  run:
    working-directory: windows

jobs:
  test:
    name: Core tests (PowerShell, Git Bash, cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Shells on this runner
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
      - name: Test
        run: dotnet test --project tests/Envy.Core.Tests --report-xunit-trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: windows/TestResults

  app:
    name: App and installer
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
      # SignPath reads the uploaded unsigned files through this token.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if (-not $tag) { $tag = '${{ inputs.tag }}' }
          $version = if ($tag) { $tag.TrimStart('v') } else { "0.0.${{ github.run_number }}" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Publish the app
        run: |
          dotnet publish src/Envy.App -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.version.outputs.version }} -o artifacts/publish
          Get-ChildItem src/Envy.App/bin, src/Envy.App/obj -Recurse -Filter *.pri | Format-Table FullName, Length -AutoSize
          Get-ChildItem artifacts/publish -Filter *.pri | Format-Table Name, Length
          "{0:N0} MB in {1} files" -f ((Get-ChildItem artifacts/publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), (Get-ChildItem artifacts/publish -Recurse -File).Count
      - name: Start it in a sandbox and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          New-Item -ItemType Directory -Force artifacts/smoke | Out-Null
          foreach ($run in 'fresh', 'seeded') {
            $home_ = Join-Path $env:RUNNER_TEMP "envy-$run"
            if ($run -eq 'seeded') {
              $settings = Join-Path $home_ 'AppData\Roaming\Envy'
              New-Item -ItemType Directory -Force $settings | Out-Null
              Copy-Item installer/sample-config.json (Join-Path $settings 'config.json')
              New-Item -ItemType File -Force (Join-Path $settings '.onboarded') | Out-Null
            }
            $env:ENVY_HOME = $home_
            $p = Start-Process artifacts/publish/Envy.exe -PassThru
            Start-Sleep -Seconds 20
            Shot "artifacts/smoke/$run.png"
            if ($p.HasExited) {
              $log = Join-Path $env:LOCALAPPDATA 'Envy\errors.log'
              if (Test-Path $log) { Get-Content $log }
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } | Format-List TimeCreated, ProviderName, Message
              throw "Envy exited with code $($p.ExitCode)"
            }
            $init = Join-Path $home_ 'AppData\Local\Envy\shell\init.ps1'
            if (-not (Test-Path $init)) { throw "Envy didn't write $init" }
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
          $log = Join-Path $env:LOCALAPPDATA 'Envy\errors.log'
          if (Test-Path $log) { Get-Content $log; throw 'Envy logged errors' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: windows/artifacts/smoke
      # Code signing through SignPath Foundation (windows/signing/README.md), for releases only, once the repository has
      # the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable. Until then everything stays unsigned.
      - name: Code signing
        id: signing
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $sign = '${{ steps.version.outputs.tag }}' -ne '' -and $env:HAS_TOKEN -eq 'true' -and $env:ORGANIZATION -ne ''
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($sign) { 'Signing this release through SignPath; each signing request waits for approval there.' }
          elseif ('${{ steps.version.outputs.tag }}' -ne '') { 'Not signed: SignPath is not set up for this repository yet.' }
          else { 'Not signed: only releases are signed.' }
      - name: Collect Envy's own executables
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/unsigned-app/cli | Out-Null
          Copy-Item artifacts/publish/Envy.exe, artifacts/publish/Envy.dll, artifacts/publish/Envy.Core.dll artifacts/unsigned-app/
          Copy-Item artifacts/publish/cli/envy.exe artifacts/unsigned-app/cli/
      - name: Upload them for signing
        if: steps.signing.outputs.sign == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: windows/artifacts/unsigned-app
      - name: Sign them
        if: steps.signing.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'envy' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: envy-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: windows/artifacts/signed-app
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Put the signed executables in the app
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          Copy-Item artifacts/signed-app/* artifacts/publish/ -Recurse -Force
          foreach ($file in 'Envy.exe', 'Envy.dll', 'Envy.Core.dll', 'cli/envy.exe') {
            $signature = Get-AuthenticodeSignature (Join-Path artifacts/publish $file)
            "{0}: {1} ({2})" -f $file, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid') { throw "$file isn't signed" }
          }
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/Envy.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload the installer for signing
        if: steps.signing.outputs.sign == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: windows/artifacts/Envy-Setup.exe
      - name: Sign the installer
        if: steps.signing.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'envy' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: envy-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: windows/artifacts/signed-installer
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Use the signed installer
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          Copy-Item artifacts/signed-installer/Envy-Setup.exe artifacts/Envy-Setup.exe -Force
          $signature = Get-AuthenticodeSignature artifacts/Envy-Setup.exe
          "Envy-Setup.exe: {0} ({1})" -f $signature.Status, $signature.SignerCertificate.Subject
          if ($signature.Status -ne 'Valid') { throw "Envy-Setup.exe isn't signed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Envy-Setup
          path: windows/artifacts/Envy-Setup.exe
      - name: Attach to the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" artifacts/Envy-Setup.exe --clobber

  # Opens the pull request that adds the new version to winget (windows/winget/README.md), once the repository has the
  # WINGET_TOKEN secret. Prereleases aren't submitted.
  winget:
    name: Submit to winget
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: app
    runs-on: windows-latest
    permissions: {}
    defaults:
      run:
        shell: pwsh
        working-directory: .
    env:
      PACKAGE: joeystdio.Envy
      KOMAC_VERSION: 2.17.2
      KOMAC_SHA256: 38a5a53b2291e959157a46a9ed2f20c1c66e9e238666780519650fcc8d37ad58
    steps:
      - name: Submit this release
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          INSTALLER: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/Envy-Setup.exe
        run: |
          if (-not $env:GITHUB_TOKEN) {
            "::notice::Not submitted to winget: the repository has no WINGET_TOKEN secret yet."
            exit 0
          }
          # Komac adds a version to a package that's already in winget, so the first version went in by hand.
          $manifests = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/j/$($env:PACKAGE.Replace('.', '/'))"
          Invoke-RestMethod $manifests -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" } -SkipHttpErrorCheck -StatusCodeVariable status | Out-Null
          if ($status -eq 404) {
            "::warning::$env:PACKAGE isn't in winget yet, so $env:TAG wasn't submitted. Re-run this job once the first version is accepted."
            exit 0
          }
          if ($status -ne 200) { throw "GitHub answered $status when looking for $env:PACKAGE in winget-pkgs. Is WINGET_TOKEN still valid?" }

          $komac = Join-Path $env:RUNNER_TEMP komac.exe
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC_VERSION/komac-$env:KOMAC_VERSION-x86_64-pc-windows-msvc.exe" -OutFile $komac
          if ((Get-FileHash $komac -Algorithm SHA256).Hash -ne $env:KOMAC_SHA256) { throw "komac.exe doesn't match the pinned SHA-256" }

          # Komac downloads the installer, computes its hash, reads the release notes and date from the release and opens
          # the pull request from the token owner's fork of microsoft/winget-pkgs.
          & $komac update $env:PACKAGE --version $env:TAG.TrimStart('v') --urls $env:INSTALLER --submit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
