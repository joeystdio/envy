name: Windows

on:
  push:
    branches: ["**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  # Creating a release (for example gh release create v1.2.0 dist/Envy.dmg) builds the installer and attaches it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach Envy-Setup.exe to this existing release tag (leave empty to only build)"
        required: false

defaults:
  run:
    working-directory: windows

jobs:
  test:
    name: Core tests (PowerShell, Git Bash, cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Shells on this runner
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
      - name: Test
        run: dotnet test --project tests/Envy.Core.Tests --report-xunit-trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: windows/TestResults

  app:
    name: App and installer
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if (-not $tag) { $tag = '${{ inputs.tag }}' }
          $version = if ($tag) { $tag.TrimStart('v') } else { "0.0.${{ github.run_number }}" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Publish the app
        run: |
          dotnet publish src/Envy.App -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.version.outputs.version }} -o artifacts/publish
          Get-ChildItem artifacts/publish -Filter *.pri | Format-Table Name, Length
          "{0:N0} MB in {1} files" -f ((Get-ChildItem artifacts/publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), (Get-ChildItem artifacts/publish -Recurse -File).Count
      - name: Start it in a sandbox and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          New-Item -ItemType Directory -Force artifacts/smoke | Out-Null
          foreach ($run in 'fresh', 'seeded') {
            $home_ = Join-Path $env:RUNNER_TEMP "envy-$run"
            if ($run -eq 'seeded') {
              $settings = Join-Path $home_ 'AppData\Roaming\Envy'
              New-Item -ItemType Directory -Force $settings | Out-Null
              Copy-Item installer/sample-config.json (Join-Path $settings 'config.json')
              New-Item -ItemType File -Force (Join-Path $settings '.onboarded') | Out-Null
            }
            $env:ENVY_HOME = $home_
            $p = Start-Process artifacts/publish/Envy.exe -PassThru
            Start-Sleep -Seconds 20
            Shot "artifacts/smoke/$run.png"
            if ($p.HasExited) {
              $log = Join-Path $env:LOCALAPPDATA 'Envy\errors.log'
              if (Test-Path $log) { Get-Content $log }
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } | Format-List TimeCreated, ProviderName, Message
              throw "Envy exited with code $($p.ExitCode)"
            }
            $init = Join-Path $home_ 'AppData\Local\Envy\shell\init.ps1'
            if (-not (Test-Path $init)) { throw "Envy didn't write $init" }
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
          $log = Join-Path $env:LOCALAPPDATA 'Envy\errors.log'
          if (Test-Path $log) { Get-Content $log; throw 'Envy logged errors' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: windows/artifacts/smoke
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/Envy.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Envy-Setup
          path: windows/artifacts/Envy-Setup.exe
      - name: Attach to the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" artifacts/Envy-Setup.exe --clobber
